[project]
name = "nse-algo-platform"
version = "0.0.1"
description = "NSE options + stocks research, paper trading and locked live execution platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "pyyaml>=6.0,<7",
    "fyers-apiv3>=3.3,<4",
    "cryptography>=43",
    "anthropic>=1.17,<2",  # AI slot (advisory only); brings httpx2, used for other providers
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.120",
    "types-PyYAML",
    "pandas>=2.2",  # golden tests only; never imported by engine/recorder (P7)
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/research/stats.py" = ["S311"]  # bootstrap resampling, not cryptography
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["fyers_apiv3", "fyers_apiv3.*"]  # official SDK ships no type hints
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

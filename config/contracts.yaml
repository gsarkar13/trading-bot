# Dated contract specs for MODELED option backtests (layer 2), when no recorded instrument
# master exists for a past date. Live/paper trading never uses this file: it reads the
# broker's instrument master every day (brief 3.2). On days the recorder ran, backtests
# also use the stored master instead of this file.
#
# verified: true  = read from the Fyers symbol master on the date in `source`.
# verified: false = from memory of NSE circulars; PLEASE CHECK and correct the dates.
NIFTY:
  strike_interval: 50            # verified 2026-11-26 master
  weekly_options: true
  lot_sizes:
    - {from: "2024-11-20", lot: 75, verified: false}
    - {from: "2025-12-30", lot: 65, verified: false}   # 65 itself verified in the 2026-11-26 master
  expiry_weekday:                # weekly AND monthly (monthly = last such weekday)
    - {from: "2000-01-01", weekday: 3, verified: false}  # Thursday
    - {from: "2025-09-01", weekday: 1, verified: false}  # Tuesday (all 2026-12/2027 expiries in master are Tuesdays)
BANKNIFTY:
  strike_interval: 100           # verified 2026-11-26 master
  weekly_options: false          # monthly only (brief 3.2); backtests use monthly throughout
  lot_sizes:
    - {from: "2024-11-20", lot: 30, verified: false}
    - {from: "2025-04-25", lot: 35, verified: false}
    - {from: "2025-12-30", lot: 30, verified: false}   # 30 itself verified in the 2026-11-26 master
  expiry_weekday:
    - {from: "2000-01-01", weekday: 3, verified: false}
    - {from: "2025-09-01", weekday: 1, verified: false}
source: "Fyers NSE_FO.csv downloaded 2026-11-27 (master dated 2026-11-26)"
